      function addParticles(x, y, color, count, speedScale) {
        const cap = isLowPowerMobile ? 85 : 160;
        if (particles.length > cap) return;
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const spd = (40 + Math.random() * 120) * (speedScale || 1);
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            life: 0.25 + Math.random() * 0.28,
            maxLife: 0.5,
            size: 2.2 + Math.random() * 3,
            color: color
          });
        }
      }

      function addFloatingText(x, y, text, color, size) {
        if (floatingTexts.length > 60) floatingTexts.shift();
        floatingTexts.push({
          x: x + (Math.random() - 0.5) * 14,
          y: y - 10,
          vy: -48,
          text: text,
          color: color || '#f8fafc',
          size: size || 13,
          life: 0.6,
          maxLife: 0.6
        });
      }

      function damageEnemy(enemy, amount, knockX, knockY, knockForce) {
        enemy.hp -= amount;
        enemy.flashTimer = 0.09;
        const resist = enemy.type === 'boss' ? 0.04 : enemy.type === 'elite' ? 0.15 : enemy.type === 'tank' ? 0.35 : 1;
        if (knockForce) {
          enemy.x += knockX * knockForce * resist;
          enemy.y += knockY * knockForce * resist;
        }
        addFloatingText(
          enemy.x,
          enemy.y - enemy.radius,
          String(Math.round(amount)),
          amount >= 30 ? '#fbbf24' : '#f8fafc',
          amount >= 30 ? 15 : 12
        );

        if (enemy.hp <= 0) {
          kills += 1;
          sfxKill();
          addParticles(enemy.x, enemy.y, enemy.color, enemy.type === 'elite' ? 22 : 9, enemy.type === 'elite' ? 1.5 : 1);

          // Drop XP Gem
          gems.push({
            x: enemy.x,
            y: enemy.y,
            value: enemy.xpValue,
            kind: enemy.type === 'elite' ? 'mega' : enemy.xpValue >= 5 ? 'mid' : 'small',
            magnetized: false
          });

          if (enemy.type === 'boss') {
            addParticles(enemy.x, enemy.y, '#fbbf24', 36, 2.0);
            addParticles(enemy.x, enemy.y, '#f43f5e', 30, 1.8);
            boss = null;
            bossDefeated = true;
            bossHud.classList.add('hidden');
            enemyBullets = [];
            shakeTime = 0.55;
            shakeIntensity = 12;
            endGame(true);
            return true;
          }

          // Elite drops heal orb too
          if (enemy.type === 'elite') {
            gems.push({
              x: enemy.x + 18,
              y: enemy.y - 10,
              value: 0,
              heal: 30,
              kind: 'heal',
              magnetized: false
            });
            shakeTime = 0.22;
            shakeIntensity = 6;
            showWaveBanner(tr().eliteKill);
          }
          return true;
        } else {
          sfxHit();
          return false;
        }
      }

      // --- Level Up Flow ---
      function triggerLevelUp() {
        gameState = 'levelup';
        sfxLevelUp();
        triggerHaptic(30);

        const available = UPGRADES.filter(function (u) {
          return (player.upgradeLevels[u.id] || 0) < u.maxLevel;
        });

        // Shuffle and pick 3
        const pool = available.slice();
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = pool[i];
          pool[i] = pool[j];
          pool[j] = tmp;
        }
        currentUpgradeChoices = pool.slice(0, 3);

        // Fallback if all upgrades maxed
        if (currentUpgradeChoices.length === 0) {
          currentUpgradeChoices = [
            {
              id: 'bonus_heal',
              icon: '✨',
              getName: function () { return tr().upgrades.bonus_heal.name; },
              maxLevel: 99,
              getDesc: function () { return tr().upgrades.bonus_heal.desc(); },
              apply: function (p) {
                p.hp = Math.min(p.maxHp, p.hp + 50);
                p.weapons.boltDamage = Math.round(p.weapons.boltDamage * 1.15);
                p.weapons.orbitalDamage = Math.round(p.weapons.orbitalDamage * 1.15);
                p.weapons.auraDamage = Math.round(p.weapons.auraDamage * 1.15);
                p.weapons.lightningDamage = Math.round(p.weapons.lightningDamage * 1.15);
                p.weapons.fireDamage = Math.round(p.weapons.fireDamage * 1.15);
              }
            }
          ];
        }

        renderUpgradeCards();

        levelupOverlay.classList.remove('hidden');
      }

      function renderUpgradeCards() {
        if (!player || currentUpgradeChoices.length === 0) return;
        levelupTitle.textContent = tr().levelUpTitle(player.level);
        upgradeCardsEl.innerHTML = '';

        currentUpgradeChoices.forEach(function (upg, index) {
          const curLv = player.upgradeLevels[upg.id] || 0;
          const isNew = curLv === 0 && (upg.id === 'orbital' || upg.id === 'aura' || upg.id === 'lightning' || upg.id === 'firezone');
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'upgrade-card';
          const upgName = upg.getName ? upg.getName() : upg.name;
          card.innerHTML =
            '<span class="key-hint">' + (index + 1) + '</span>' +
            '<div class="upgrade-icon">' + upg.icon + '</div>' +
            '<div class="upgrade-name">' + upgName + '</div>' +
            '<span class="upgrade-tag ' + (isNew ? 'new' : '') + '">' +
              (isNew ? tr().newWeaponTag : 'LV ' + curLv + ' → ' + (curLv + 1)) +
            '</span>' +
            '<div class="upgrade-desc">' + upg.getDesc(curLv) + '</div>';

          card.addEventListener('click', function () {
            selectUpgrade(index);
          });
          upgradeCardsEl.appendChild(card);
        });
      }

      function selectUpgrade(index) {
        if (gameState !== 'levelup') return;
        const chosen = currentUpgradeChoices[index];
        if (!chosen) return;
        ensureAudio();
        chosen.apply(player);
        player.upgradeLevels[chosen.id] = (player.upgradeLevels[chosen.id] || 0) + 1;
        playTone(740, 0.12, 'triangle', 0.07, 980);

        levelupOverlay.classList.add('hidden');
        updateBuildStrip();
        updateHUD();

        // Check if excess XP triggers another level up
        if (player.xp >= player.xpToNext) {
          player.xp -= player.xpToNext;
          player.level += 1;
          player.xpToNext = Math.round(player.xpToNext * 1.32 + 6);
          triggerLevelUp();
        } else {
          gameState = 'playing';
        }
      }

      function endGame(isVictory) {
        gameState = isVictory ? 'victory' : 'gameover';
        const rec = saveRecord(elapsedTime, kills);

        if (isVictory) {
          gameoverTitle.textContent = tr().victoryTitle;
          gameoverSubtitle.textContent = tr().victorySub;
          continueEndlessBtn.style.display = 'inline-block';
          sfxLevelUp();
          triggerHaptic(30);
        } else {
          gameoverTitle.textContent = tr().gameoverTitle;
          gameoverSubtitle.textContent = tr().gameoverSub;
          continueEndlessBtn.style.display = 'none';
          sfxHurt();
        }

        resultTime.textContent = formatTime(elapsedTime);
        resultKills.textContent = String(kills);
        resultLevel.textContent = 'LV. ' + player.level;
        gameoverRecord.innerHTML = tr().recordFmt(formatTime(rec.bestTime), rec.bestKills);

        gameoverOverlay.classList.remove('hidden');
      }

      // --- Update Loop ---
      function update(dt) {
        if (gameState !== 'playing') return;

        elapsedTime += dt;
        if (elapsedTime > 8) {
          controlHint.style.opacity = '0';
        }

        // Spawn Final Boss at 5:00
        if (!endlessMode && !bossSpawned && elapsedTime >= TARGET_WIN_TIME) {
          spawnFinalBoss();
        }

        // Wave progression
        const nextWave = getWaveForTime(elapsedTime);
        if (nextWave !== currentWave && !endlessMode) {
          currentWave = nextWave;
          showWaveBanner(tr().waveMessages[currentWave] || 'WAVE ' + currentWave);
        }

        if (waveBannerTimer > 0) {
          waveBannerTimer -= dt;
          if (waveBannerTimer <= 0) {
            waveBanner.classList.remove('show');
          }
        }

        // Screen shake decay
        if (shakeTime > 0) {
          shakeTime = Math.max(0, shakeTime - dt);
        }

        // Player Movement (Keyboard + Virtual Joystick)
        let moveX = 0;
        let moveY = 0;
        if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

        if (joystick.active && (Math.abs(joystick.dx) > 0.08 || Math.abs(joystick.dy) > 0.08)) {
          moveX = joystick.dx;
          moveY = joystick.dy;
        }

        const mag = Math.hypot(moveX, moveY);
        if (mag > 0.001) {
          const nx = moveX / Math.max(1, mag);
          const ny = moveY / Math.max(1, mag);
          player.x += nx * player.speed * dt;
          player.y += ny * player.speed * dt;
          player.facingX = nx;
          player.facingY = ny;
        }

        if (player.invulnTimer > 0) {
          player.invulnTimer = Math.max(0, player.invulnTimer - dt);
        }

        // Enemy Spawning
        const maxEnemies = Math.min(170, 44 + Math.floor(elapsedTime * 0.7));
        const spawnInterval = Math.max(0.12, 0.8 - elapsedTime * 0.005);
        spawnTimer -= dt;
        if (spawnTimer <= 0 && enemies.length < maxEnemies) {
          const batch = elapsedTime > 120 ? 3 : elapsedTime > 55 ? 2 : 1;
          for (let b = 0; b < batch; b++) {
            spawnEnemy();
          }
          spawnTimer = spawnInterval;
        }

        // Elite Spawn Timer (paused while Final Boss is active)
        if (!boss) {
          eliteTimer -= dt;
          if (eliteTimer <= 0) {
            spawnEnemy('elite');
            showWaveBanner(tr().eliteSpawn);
            eliteTimer = 40;
          }
        }

        // Weapon 1: Auto-Bolt
        player.weapons.boltTimer -= dt;
        if (player.weapons.boltTimer <= 0 && enemies.length > 0) {
          // Find nearest enemies sorted by distance
          const nearest = [];
          for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            const d2 = (e.x - player.x) * (e.x - player.x) + (e.y - player.y) * (e.y - player.y);
            if (d2 < 650 * 650) {
              nearest.push({ e: e, d2: d2 });
            }
          }
          nearest.sort(function (a, b) { return a.d2 - b.d2; });

          if (nearest.length > 0) {
            const count = player.weapons.boltCount;
            const baseTarget = nearest[0].e;
            const baseAngle = Math.atan2(baseTarget.y - player.y, baseTarget.x - player.x);

            for (let c = 0; c < count; c++) {
              let angle = baseAngle;
              if (nearest.length > c) {
                const t = nearest[c].e;
                angle = Math.atan2(t.y - player.y, t.x - player.x);
              } else if (count > 1) {
                const spread = 0.22;
                angle = baseAngle + (c - (count - 1) / 2) * spread;
              }
              projectiles.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * player.weapons.boltSpeed,
                vy: Math.sin(angle) * player.weapons.boltSpeed,
                radius: 6,
                damage: player.weapons.boltDamage,
                pierceLeft: player.weapons.boltPierce,
                hitSet: new Set(),
                life: 1.45
              });
            }
            sfxShoot();
            player.weapons.boltTimer = player.weapons.boltCooldown;
          }
        }

        // Weapon 2: Orbital Blades
        if (player.weapons.orbitalCount > 0) {
          player.weapons.orbitalAngle += player.weapons.orbitalSpeed * dt;
          const count = player.weapons.orbitalCount;
          const orbRadius = player.weapons.orbitalRadius;
          const bladeSize = 11;

          for (let b = 0; b < count; b++) {
            const a = player.weapons.orbitalAngle + (b * Math.PI * 2) / count;
            const bx = player.x + Math.cos(a) * orbRadius;
            const by = player.y + Math.sin(a) * orbRadius;

            for (let i = enemies.length - 1; i >= 0; i--) {
              const e = enemies[i];
              if (e.orbitalHitCooldown > 0) continue;
              const dx = e.x - bx;
              const dy = e.y - by;
              const hitDist = e.radius + bladeSize;
              if (dx * dx + dy * dy <= hitDist * hitDist) {
                e.orbitalHitCooldown = 0.28;
                const d = Math.hypot(e.x - player.x, e.y - player.y) || 1;
                const dead = damageEnemy(e, player.weapons.orbitalDamage, (e.x - player.x) / d, (e.y - player.y) / d, 14);
                if (dead) enemies.splice(i, 1);
              }
            }
          }
        }

        // Weapon 3: Pulse Aura
        if (player.weapons.auraLevel > 0) {
          player.weapons.auraTimer -= dt;
          if (player.weapons.auraTimer <= 0) {
            player.weapons.auraTimer = player.weapons.auraCooldown;
            const r = player.weapons.auraRadius;
            shockwaves.push({
              x: player.x,
              y: player.y,
              radius: 12,
              maxRadius: r,
              life: 0.34,
              maxLife: 0.34
            });
            sfxPulse();
            for (let i = enemies.length - 1; i >= 0; i--) {
              const e = enemies[i];
              const dx = e.x - player.x;
              const dy = e.y - player.y;
              const dist = Math.hypot(dx, dy);
              if (dist <= r + e.radius) {
                const nx = dist > 0.01 ? dx / dist : 1;
                const ny = dist > 0.01 ? dy / dist : 0;
                const dead = damageEnemy(e, player.weapons.auraDamage, nx, ny, 24);
                if (dead) enemies.splice(i, 1);
              }
            }
          }
        }

        // Weapon 4: Chain Lightning
        if (player.weapons.lightningLevel > 0) {
          player.weapons.lightningTimer -= dt;
          if (player.weapons.lightningTimer <= 0 && enemies.length > 0) {
            let bestIdx = -1;
            let bestD2 = 440 * 440;
            for (let i = 0; i < enemies.length; i++) {
              const e = enemies[i];
              const d2 = (e.x - player.x) * (e.x - player.x) + (e.y - player.y) * (e.y - player.y);
              if (d2 < bestD2) {
                bestD2 = d2;
                bestIdx = i;
              }
            }

            if (bestIdx !== -1) {
              player.weapons.lightningTimer = player.weapons.lightningCooldown;
              sfxLightning();
              const hitEnemies = new Set();
              const points = [{ x: player.x, y: player.y }];
              let currTarget = enemies[bestIdx];
              const deadList = [];

              for (let c = 0; c < player.weapons.lightningChains && currTarget; c++) {
                hitEnemies.add(currTarget);
                points.push({ x: currTarget.x, y: currTarget.y });
                addParticles(currTarget.x, currTarget.y, '#93c5fd', 6, 1.1);
                const dead = damageEnemy(currTarget, player.weapons.lightningDamage, 0, 0, 0);
                if (dead) deadList.push(currTarget);

                // Find next nearest unhit enemy
                let nextTarget = null;
                let nextD2 = player.weapons.lightningRange * player.weapons.lightningRange;
                for (let j = 0; j < enemies.length; j++) {
                  const cand = enemies[j];
                  if (hitEnemies.has(cand) || cand.hp <= 0) continue;
                  const dx = cand.x - currTarget.x;
                  const dy = cand.y - currTarget.y;
                  const d2 = dx * dx + dy * dy;
                  if (d2 < nextD2) {
                    nextD2 = d2;
                    nextTarget = cand;
                  }
                }
                currTarget = nextTarget;
              }

              // Remove defeated enemies
              if (deadList.length > 0) {
                for (let k = enemies.length - 1; k >= 0; k--) {
                  if (deadList.indexOf(enemies[k]) !== -1) {
                    enemies.splice(k, 1);
                  }
                }
              }

              lightningArcs.push({
                points: points,
                life: 0.22,
                maxLife: 0.22
              });
              if (gameState !== 'playing') return;
            }
          }
        }

        // Weapon 5: Fire Zone Spawner
        if (player.weapons.fireLevel > 0) {
          player.weapons.fireTimer -= dt;
          if (player.weapons.fireTimer <= 0) {
            player.weapons.fireTimer = player.weapons.fireCooldown;
            sfxFire();
            const nearby = enemies.filter(function (e) {
              const d2 = (e.x - player.x) * (e.x - player.x) + (e.y - player.y) * (e.y - player.y);
              return d2 < 420 * 420;
            });
            for (let z = 0; z < player.weapons.fireCount; z++) {
              let fx, fy;
              if (nearby.length > 0) {
                const pick = nearby[Math.floor(Math.random() * nearby.length)];
                fx = pick.x + (Math.random() - 0.5) * 30;
                fy = pick.y + (Math.random() - 0.5) * 30;
              } else {
                const a = Math.random() * Math.PI * 2;
                const d = 80 + Math.random() * 110;
                fx = player.x + Math.cos(a) * d;
                fy = player.y + Math.sin(a) * d;
              }
              fireZones.push({
                x: fx,
                y: fy,
                radius: player.weapons.fireRadius,
                damage: player.weapons.fireDamage,
                life: player.weapons.fireDuration,
                maxLife: player.weapons.fireDuration,
                tickTimer: 0.05
              });
            }
          }
        }

        // Update Fire Zones
        for (let i = fireZones.length - 1; i >= 0; i--) {
          const z = fireZones[i];
          z.life -= dt;
          z.tickTimer -= dt;
          if (Math.random() < 0.35) {
            const a = Math.random() * Math.PI * 2;
            const r = Math.random() * z.radius * 0.85;
            addParticles(z.x + Math.cos(a) * r, z.y + Math.sin(a) * r, '#fb923c', 1, 0.35);
          }
          if (z.tickTimer <= 0) {
            z.tickTimer = 0.35;
            for (let j = enemies.length - 1; j >= 0; j--) {
              const e = enemies[j];
              const dx = e.x - z.x;
              const dy = e.y - z.y;
              const hitR = z.radius + e.radius * 0.6;
              if (dx * dx + dy * dy <= hitR * hitR) {
                const dead = damageEnemy(e, z.damage, 0, 0, 0);
                if (dead) {
                  enemies.splice(j, 1);
                  if (gameState !== 'playing') return;
                }
              }
            }
          }
          if (z.life <= 0) fireZones.splice(i, 1);
        }

        // Update Lightning Arcs
        for (let i = lightningArcs.length - 1; i >= 0; i--) {
          lightningArcs[i].life -= dt;
          if (lightningArcs[i].life <= 0) lightningArcs.splice(i, 1);
        }

        // Update Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) {
            projectiles.splice(i, 1);
            continue;
          }

          let removed = false;
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (p.hitSet.has(e)) continue;
            const dx = e.x - p.x;
            const dy = e.y - p.y;
            const r = e.radius + p.radius;
            if (dx * dx + dy * dy <= r * r) {
              p.hitSet.add(e);
              const vMag = Math.hypot(p.vx, p.vy) || 1;
              const dead = damageEnemy(e, p.damage, p.vx / vMag, p.vy / vMag, 10);
              if (dead) enemies.splice(j, 1);

              if (p.pierceLeft > 0) {
                p.pierceLeft -= 1;
              } else {
                projectiles.splice(i, 1);
                removed = true;
                break;
              }
            }
          }
          if (removed) continue;
        }

        // Update Enemies & Soft Separation
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.flashTimer > 0) e.flashTimer -= dt;
          if (e.orbitalHitCooldown > 0) e.orbitalHitCooldown -= dt;

          const dx = player.x - e.x;
          const dy = player.y - e.y;
          const dist = Math.hypot(dx, dy) || 1;

          if (e.type === 'boss') {
            e.rotAngle += dt * (e.enraged ? 2.6 : 1.4);
            if (!e.enraged && e.hp <= e.maxHp * 0.55) {
              e.enraged = true;
              showWaveBanner(tr().bossEnrage);
              sfxBossWarn();
              triggerHaptic([60, 40, 80]);
              for (let s = 0; s < 6; s++) spawnEnemy('runner');
            }

            if (e.aiState === 'chase') {
              e.x += (dx / dist) * e.speed * (e.enraged ? 1.18 : 1) * dt;
              e.y += (dy / dist) * e.speed * (e.enraged ? 1.18 : 1) * dt;
              e.patternTimer -= dt;
              if (e.patternTimer <= 0) {
                if (e.nextPattern === 'charge') {
                  e.aiState = 'telegraph';
                  e.stateTimer = e.enraged ? 0.65 : 0.85;
                  e.chargeDirX = dx / dist;
                  e.chargeDirY = dy / dist;
                  e.nextPattern = 'ring';
                  playTone(340, 0.2, 'sawtooth', 0.06, 620);
                } else {
                  // Radial bullet ring
                  const count = e.enraged ? 16 : 12;
                  const baseA = Math.atan2(dy, dx);
                  const bSpd = e.enraged ? 285 : 240;
                  for (let k = 0; k < count; k++) {
                    const a = baseA + (k * Math.PI * 2) / count;
                    enemyBullets.push({
                      x: e.x,
                      y: e.y,
                      vx: Math.cos(a) * bSpd,
                      vy: Math.sin(a) * bSpd,
                      radius: 7,
                      damage: 20,
                      life: 3.4
                    });
                  }
                  addParticles(e.x, e.y, '#fb7185', 14, 1.3);
                  playTone(260, 0.16, 'square', 0.06, 120);
                  e.nextPattern = 'charge';
                  e.patternTimer = e.enraged ? 1.9 : 2.5;
                }
              }
            } else if (e.aiState === 'telegraph') {
              e.stateTimer -= dt;
              if (e.stateTimer <= 0) {
                e.aiState = 'charge';
                e.stateTimer = 0.52;
                playTone(500, 0.18, 'sawtooth', 0.075, 160);
              }
            } else if (e.aiState === 'charge') {
              const dashSpd = e.speed * (e.enraged ? 5.2 : 4.5);
              e.x += e.chargeDirX * dashSpd * dt;
              e.y += e.chargeDirY * dashSpd * dt;
              if (Math.random() < 0.7) {
                addParticles(e.x, e.y, '#f43f5e', 1, 0.4);
              }
              e.stateTimer -= dt;
              if (e.stateTimer <= 0) {
                e.aiState = 'chase';
                e.patternTimer = e.enraged ? 2.0 : 2.8;
              }
            }
          } else {
            e.x += (dx / dist) * e.speed * dt;
            e.y += (dy / dist) * e.speed * dt;
          }

          // Simple separation from a few neighbors
          for (let j = i + 1; j < enemies.length; j++) {
            const other = enemies[j];
            const sx = e.x - other.x;
            const sy = e.y - other.y;
            const minD = e.radius + other.radius;
            const d2 = sx * sx + sy * sy;
            if (d2 > 0.01 && d2 < minD * minD) {
              const d = Math.sqrt(d2);
              const push = (minD - d) * 0.35;
              const px = (sx / d) * push;
              const py = (sy / d) * push;
              e.x += px;
              e.y += py;
              other.x -= px;
              other.y -= py;
            }
          }

          // Player Collision
          const hitR = player.radius + e.radius - 3;
          if (dist < hitR && player.invulnTimer <= 0) {
            player.hp -= e.damage;
            player.invulnTimer = 0.48;
            shakeTime = 0.2;
            shakeIntensity = 7;
            sfxHurt();
            triggerHaptic(35);
            addFloatingText(player.x, player.y - 20, '-' + e.damage, '#fb7185', 15);
            addParticles(player.x, player.y, '#f43f5e', 10, 1.1);

            if (player.hp <= 0) {
              player.hp = 0;
              updateHUD();
              endGame(false);
              return;
            }
          }
        }

        // Update Enemy Bullets (Boss Projectiles)
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const b = enemyBullets[i];
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.life -= dt;
          if (b.life <= 0) {
            enemyBullets.splice(i, 1);
            continue;
          }
          const dx = player.x - b.x;
          const dy = player.y - b.y;
          const hitR = player.radius + b.radius - 2;
          if (dx * dx + dy * dy <= hitR * hitR) {
            enemyBullets.splice(i, 1);
            if (player.invulnTimer <= 0) {
              player.hp -= b.damage;
              player.invulnTimer = 0.48;
              shakeTime = 0.2;
              shakeIntensity = 7;
              sfxHurt();
              addFloatingText(player.x, player.y - 20, '-' + b.damage, '#fb7185', 15);
              addParticles(player.x, player.y, '#f43f5e', 10, 1.1);
              if (player.hp <= 0) {
                player.hp = 0;
                updateHUD();
                endGame(false);
                return;
              }
            }
          }
        }

        // Update XP Gems & Magnet
        const magR2 = player.magnetRadius * player.magnetRadius;
        for (let i = gems.length - 1; i >= 0; i--) {
          const g = gems[i];
          const dx = player.x - g.x;
          const dy = player.y - g.y;
          const d2 = dx * dx + dy * dy;

          if (d2 < magR2) {
            g.magnetized = true;
          }

          if (g.magnetized) {
            const d = Math.sqrt(d2) || 1;
            const pullSpeed = 480;
            g.x += (dx / d) * pullSpeed * dt;
            g.y += (dy / d) * pullSpeed * dt;
          }

          if (d2 < (player.radius + 10) * (player.radius + 10)) {
            if (g.kind === 'heal') {
              player.hp = Math.min(player.maxHp, player.hp + (g.heal || 30));
              addFloatingText(player.x, player.y - 22, '+' + (g.heal || 30) + ' HP', '#34d399', 14);
              playTone(620, 0.14, 'sine', 0.07, 880);
            } else {
              player.xp += g.value;
              sfxGem();
            }
            gems.splice(i, 1);

            if (player.xp >= player.xpToNext) {
              player.xp -= player.xpToNext;
              player.level += 1;
              player.xpToNext = Math.round(player.xpToNext * 1.32 + 6);
              updateHUD();
              triggerLevelUp();
              return;
            }
          }
        }

        // Update Shockwaves
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const s = shockwaves[i];
          s.life -= dt;
          const prog = 1 - Math.max(0, s.life / s.maxLife);
          s.radius = 12 + (s.maxRadius - 12) * prog;
          if (s.life <= 0) shockwaves.splice(i, 1);
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.vx *= 0.94;
          pt.vy *= 0.94;
          pt.life -= dt;
          if (pt.life <= 0) particles.splice(i, 1);
        }

        // Update Floating Texts
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y += ft.vy * dt;
          ft.life -= dt;
          if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        updateHUD();
      }

      // --- Render ---
      function draw() {
        ctx.save();
        ctx.fillStyle = '#0b0e17';
        ctx.fillRect(0, 0, width, height);

        if (!player) {
          drawIdleBackground();
          ctx.restore();
          return;
        }

        // Camera offset (player centered)
        let shakeX = 0;
        let shakeY = 0;
        if (shakeTime > 0) {
          shakeX = (Math.random() - 0.5) * 2 * shakeIntensity;
          shakeY = (Math.random() - 0.5) * 2 * shakeIntensity;
        }

        const viewW = width / worldScale;
        const viewH = height / worldScale;
        const camX = player.x - viewW / 2 + shakeX;
        const camY = player.y - viewH / 2 + shakeY;

        // World Space Transform (with adaptive mobile zoom)
        ctx.save();
        ctx.scale(worldScale, worldScale);

        // Infinite scrolling grid background
        const gridSize = 64;
        const offsetX = ((-camX % gridSize) + gridSize) % gridSize;
        const offsetY = ((-camY % gridSize) + gridSize) % gridSize;

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.065)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = offsetX; x < viewW; x += gridSize) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, viewH);
        }
        for (let y = offsetY; y < viewH; y += gridSize) {
          ctx.moveTo(0, y);
          ctx.lineTo(viewW, y);
        }
        ctx.stroke();

        // Subtle grid dots
        if (!isLowPowerMobile) {
          ctx.fillStyle = 'rgba(148, 163, 184, 0.14)';
          for (let x = offsetX; x < viewW; x += gridSize) {
            for (let y = offsetY; y < viewH; y += gridSize) {
              ctx.fillRect(x - 1, y - 1, 2, 2);
            }
          }
        }

        ctx.translate(-camX, -camY);

        // Magnet radius faint ring
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.magnetRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.09)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Fire Zones (Ground Layer)
        for (let i = 0; i < fireZones.length; i++) {
          const z = fireZones[i];
          const fade = Math.min(1, z.life / 0.6);
          const pulse = 0.92 + Math.sin(elapsedTime * 10 + i) * 0.08;
          const rad = z.radius * pulse;
          const grad = ctx.createRadialGradient(z.x, z.y, 4, z.x, z.y, rad);
          grad.addColorStop(0, 'rgba(251, 146, 60, ' + (0.42 * fade).toFixed(2) + ')');
          grad.addColorStop(0.65, 'rgba(239, 68, 68, ' + (0.28 * fade).toFixed(2) + ')');
          grad.addColorStop(1, 'rgba(239, 68, 68, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(z.x, z.y, rad, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(251, 146, 60, ' + (0.65 * fade).toFixed(2) + ')';
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 6]);
          ctx.beginPath();
          ctx.arc(z.x, z.y, rad, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Boss Charge Telegraph Line
        if (boss && boss.aiState === 'telegraph') {
          ctx.save();
          ctx.strokeStyle = 'rgba(244, 63, 94, 0.78)';
          ctx.lineWidth = 10;
          ctx.setLineDash([14, 10]);
          ctx.beginPath();
          ctx.moveTo(boss.x, boss.y);
          ctx.lineTo(boss.x + boss.chargeDirX * 520, boss.y + boss.chargeDirY * 520);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
        }

        // Shockwaves
        for (let i = 0; i < shockwaves.length; i++) {
          const s = shockwaves[i];
          const alpha = Math.max(0, s.life / s.maxLife);
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(52, 211, 153, ' + (alpha * 0.85).toFixed(2) + ')';
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.fillStyle = 'rgba(52, 211, 153, ' + (alpha * 0.12).toFixed(2) + ')';
          ctx.fill();
        }

        // Gems (캣닢 잎사귀 · 황금 생선 · 특대 참치캔 · 회복 하트)
        for (let i = 0; i < gems.length; i++) {
          const g = gems[i];
          if (g.x < camX - 28 || g.x > camX + viewW + 28 || g.y < camY - 28 || g.y > camY + viewH + 28) continue;
          ctx.save();
          ctx.translate(g.x, g.y + Math.sin(elapsedTime * 5 + i) * 1.5);
          if (g.kind === 'heal') {
            // Glowing Heart Heal
            ctx.fillStyle = '#fb7185';
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(0, 6);
            ctx.bezierCurveTo(-10, -2, -10, -10, -4, -10);
            ctx.bezierCurveTo(-1, -10, 0, -7, 0, -6);
            ctx.bezierCurveTo(0, -7, 1, -10, 4, -10);
            ctx.bezierCurveTo(10, -10, 10, -2, 0, 6);
            ctx.closePath();
            ctx.fill();
          } else if (g.kind === 'mega') {
            // Mega Tuna Can
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-9, -6, 18, 12);
            ctx.fillStyle = '#e0f2fe';
            ctx.beginPath();
            ctx.ellipse(0, -6, 9, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(-9, -1, 18, 4);
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(0, 1, 2.2, 0, Math.PI * 2);
            ctx.fill();
          } else if (g.kind === 'mid') {
            // Golden Fish Treat
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.ellipse(-1, 0, 6.5, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(4, 0);
            ctx.lineTo(9, -4);
            ctx.lineTo(9, 4);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(-4, -1, 1, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Mint Catnip Leaf
            ctx.rotate(-0.45);
            ctx.shadowColor = '#34d399';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#34d399';
            ctx.beginPath();
            ctx.moveTo(0, -7);
            ctx.quadraticCurveTo(6.5, -1, 0, 7);
            ctx.quadraticCurveTo(-6.5, -1, 0, -7);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#d1fae5';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.lineTo(0, 6);
            ctx.stroke();
          }
          ctx.restore();
        }

        // Enemies (뚱냥이 군단!)
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.x < camX - 60 || e.x > camX + viewW + 60 || e.y < camY - 60 || e.y > camY + viewH + 60) continue;
          drawChonkyCat(e);
        }

        // Orbital Fishbones (회전 생선가시)
        if (player.weapons.orbitalCount > 0) {
          const count = player.weapons.orbitalCount;
          const orbR = player.weapons.orbitalRadius;
          for (let b = 0; b < count; b++) {
            const a = player.weapons.orbitalAngle + (b * Math.PI * 2) / count;
            const bx = player.x + Math.cos(a) * orbR;
            const by = player.y + Math.sin(a) * orbR;

            ctx.save();
            ctx.translate(bx, by);
            ctx.rotate(a + Math.PI / 2);
            ctx.strokeStyle = '#f8fafc';
            ctx.fillStyle = '#fde047';
            ctx.shadowColor = '#facc15';
            ctx.shadowBlur = 11;
            ctx.lineWidth = 2.4;
            ctx.lineCap = 'round';

            // Spine
            ctx.beginPath();
            ctx.moveTo(0, -11);
            ctx.lineTo(0, 11);
            // Ribs
            ctx.moveTo(-5.5, -3);
            ctx.lineTo(5.5, -3);
            ctx.moveTo(-6, 2);
            ctx.lineTo(6, 2);
            ctx.moveTo(-4, 6.5);
            ctx.lineTo(4, 6.5);
            ctx.stroke();

            // Cute Fish Head
            ctx.beginPath();
            ctx.moveTo(0, -14);
            ctx.lineTo(5.5, -7);
            ctx.lineTo(-5.5, -7);
            ctx.closePath();
            ctx.fill();

            // Tail fin
            ctx.beginPath();
            ctx.moveTo(0, 10);
            ctx.lineTo(5, 15);
            ctx.lineTo(-5, 15);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
        }

        // Chain Lightning Arcs
        for (let i = 0; i < lightningArcs.length; i++) {
          const arc = lightningArcs[i];
          const alpha = Math.max(0, arc.life / arc.maxLife);
          if (arc.points.length < 2) continue;
          ctx.save();
          ctx.strokeStyle = 'rgba(125, 211, 252, ' + alpha.toFixed(2) + ')';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 14;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          for (let p = 0; p < arc.points.length - 1; p++) {
            const a = arc.points[p];
            const b = arc.points[p + 1];
            ctx.moveTo(a.x, a.y);
            const segs = 4;
            for (let s = 1; s < segs; s++) {
              const t = s / segs;
              const jx = a.x + (b.x - a.x) * t + (Math.random() - 0.5) * 18;
              const jy = a.y + (b.y - a.y) * t + (Math.random() - 0.5) * 18;
              ctx.lineTo(jx, jy);
            }
            ctx.lineTo(b.x, b.y);
          }
          ctx.stroke();

          ctx.strokeStyle = 'rgba(255, 255, 255, ' + (alpha * 0.9).toFixed(2) + ')';
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.restore();
        }

        // Enemy Bullets (대왕 뚱냥이 분홍 발바닥 젤리 탄막)
        if (enemyBullets.length > 0) {
          ctx.save();
          for (let i = 0; i < enemyBullets.length; i++) {
            const b = enemyBullets[i];
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#fb7185';
            // Main paw pad
            ctx.beginPath();
            ctx.ellipse(0, 2, 5.2, 4.2, 0, 0, Math.PI * 2);
            ctx.fill();
            // 3 tiny toe beans
            ctx.fillStyle = '#ffe4e6';
            ctx.beginPath();
            ctx.arc(-4.5, -3.5, 2.2, 0, Math.PI * 2);
            ctx.arc(0, -5.2, 2.3, 0, Math.PI * 2);
            ctx.arc(4.5, -3.5, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
          ctx.restore();
        }

        // Projectiles (날아가는 츄르 스틱!)
        for (let i = 0; i < projectiles.length; i++) {
          const p = projectiles[i];
          const ang = Math.atan2(p.vy, p.vx);
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(ang);
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 10;
          // Churu sachet body
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(-10, -3.5, 16, 7);
          // Pink flavor stripe
          ctx.fillStyle = '#f472b6';
          ctx.fillRect(-4, -3.5, 5, 7);
          // Cream treat tip
          ctx.fillStyle = '#fef3c7';
          ctx.beginPath();
          ctx.moveTo(6, -3);
          ctx.lineTo(12, 0);
          ctx.lineTo(6, 3);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // Player (츄르 든 집사 캐릭터!)
        ctx.save();
        ctx.translate(player.x, player.y);
        const blink = player.invulnTimer > 0 && Math.floor(player.invulnTimer * 18) % 2 === 0;
        const fAng = Math.atan2(player.facingY, player.facingX);

        // Soft aura under butler
        ctx.shadowColor = blink ? '#f43f5e' : '#38bdf8';
        ctx.shadowBlur = 16;

        // Butler coat / body
        ctx.fillStyle = blink ? '#fda4af' : '#1e293b';
        ctx.beginPath();
        ctx.arc(0, 3, player.radius, 0, Math.PI * 2);
        ctx.fill();

        // White shirt V & red bowtie
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(-5, 6);
        ctx.lineTo(5, 6);
        ctx.lineTo(0, 14);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.moveTo(0, 8);
        ctx.lineTo(-4.5, 5.5);
        ctx.lineTo(-4.5, 10.5);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, 8);
        ctx.lineTo(4.5, 5.5);
        ctx.lineTo(4.5, 10.5);
        ctx.closePath();
        ctx.fill();

        // Chibi head
        ctx.fillStyle = blink ? '#fecdd3' : '#fde68a';
        ctx.beginPath();
        ctx.arc(0, -4, 11.5, 0, Math.PI * 2);
        ctx.fill();

        // Hair cap & cute cowlick
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.arc(0, -6.5, 11.6, Math.PI * 0.95, Math.PI * 2.05);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(0, -17);
        ctx.quadraticCurveTo(4, -22, 7, -18);
        ctx.stroke();

        // Eyes looking toward movement direction
        const lookX = player.facingX * 2.4;
        const lookY = player.facingY * 1.6;
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-3.6 + lookX, -3 + lookY, 1.8, 0, Math.PI * 2);
        ctx.arc(3.6 + lookX, -3 + lookY, 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Little Churu tube held in hand
        ctx.save();
        ctx.rotate(fAng);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(10, -2.5, 10, 5);
        ctx.fillStyle = '#f472b6';
        ctx.fillRect(14, -2.5, 3, 5);
        ctx.restore();

        // Player HP Bar underneath
        ctx.shadowBlur = 0;
        const hpW = 42;
        const hpRatio = Math.max(0, player.hp / player.maxHp);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(-hpW / 2, player.radius + 9, hpW, 6);
        ctx.fillStyle = hpRatio > 0.4 ? '#34d399' : '#f43f5e';
        ctx.fillRect(-hpW / 2, player.radius + 9, hpW * hpRatio, 6);
        ctx.restore();

        // Particles
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          const alpha = Math.max(0, pt.life / pt.maxLife);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = pt.color;
          ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
        }
        ctx.globalAlpha = 1;

        // Floating Damage Texts
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let i = 0; i < floatingTexts.length; i++) {
          const ft = floatingTexts[i];
          const alpha = Math.max(0, ft.life / ft.maxLife);
          ctx.globalAlpha = alpha;
          ctx.font = '700 ' + ft.size + 'px Inter, sans-serif';
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
        }
        ctx.globalAlpha = 1;

        ctx.restore(); // End world transform

        // Virtual Joystick (Screen Space)
        if (joystick.active && gameState === 'playing') {
          ctx.save();
          ctx.beginPath();
          ctx.arc(joystick.originX, joystick.originY, joystick.maxRadius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
          ctx.lineWidth = 2;
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(joystick.currX, joystick.currY, 22, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
          ctx.fill();
          ctx.restore();
        }

        ctx.restore();
      }

      function drawChonkyCat(e) {
        ctx.save();
        const wobbleSpeed = e.type === 'runner' ? 14 : e.type === 'boss' ? 6 : 9;
        const w = Math.sin(elapsedTime * wobbleSpeed + (e.wobblePhase || 0));
        const r = e.radius;
        const isHit = e.flashTimer > 0;
        const facingRight = player ? player.x >= e.x : true;

        ctx.translate(e.x, e.y + Math.abs(w) * -2.2);
        ctx.rotate(w * 0.08);

        // Coat palette per cat breed
        let coat = '#fb923c';       // 치즈 뚱냥이
        let belly = '#ffedd5';
        let earInner = '#fda4af';
        let stripe = '#c2410c';
        let eyeColor = '#0f172a';
        let glowColor = 'rgba(251, 146, 60, 0.35)';

        if (e.type === 'runner') {
          coat = '#334155';         // 깜냥이
          belly = '#e2e8f0';
          earInner = '#fb7185';
          stripe = '#1e293b';
          eyeColor = '#fde047';
          glowColor = 'rgba(253, 224, 71, 0.35)';
        } else if (e.type === 'tank') {
          coat = '#94a3b8';         // 회색 대왕 뚱냥이
          belly = '#f1f5f9';
          earInner = '#f9a8d4';
          stripe = '#475569';
          eyeColor = '#0f172a';
          glowColor = 'rgba(148, 163, 184, 0.35)';
        } else if (e.type === 'elite') {
          coat = '#f59e0b';         // 호랑이 뚱냥이
          belly = '#fef3c7';
          earInner = '#fb7185';
          stripe = '#7c2d12';
          eyeColor = '#dc2626';
          glowColor = 'rgba(245, 158, 11, 0.55)';
        } else if (e.type === 'boss') {
          coat = e.enraged ? '#fb7185' : '#f472b6'; // 대왕 뚱냥이 제왕
          belly = '#fff1f2';
          earInner = '#fde047';
          stripe = '#be123c';
          eyeColor = e.enraged ? '#fef08a' : '#881337';
          glowColor = e.enraged ? 'rgba(251, 146, 60, 0.75)' : 'rgba(244, 63, 94, 0.65)';
        }

        if (isHit) {
          coat = '#ffffff';
          belly = '#ffffff';
          earInner = '#ffffff';
          stripe = '#e2e8f0';
        }

        // Subtle shadow / aura
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = isLowPowerMobile ? (e.type === 'boss' ? 12 : 0) : (e.type === 'boss' ? 22 : e.type === 'elite' ? 14 : 6);

        // Wagging chonky tail behind body
        const tailSide = facingRight ? -1 : 1;
        const tailWag = Math.sin(elapsedTime * 9 + (e.wobblePhase || 0)) * (r * 0.25);
        ctx.strokeStyle = coat;
        ctx.lineWidth = Math.max(3, r * 0.24);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tailSide * r * 0.85, r * 0.2);
        ctx.quadraticCurveTo(tailSide * r * 1.45, -r * 0.2 + tailWag, tailSide * r * 1.25, -r * 0.65 + tailWag);
        ctx.stroke();

        // Pointy cat ears
        ctx.fillStyle = coat;
        // Left ear
        ctx.beginPath();
        ctx.moveTo(-r * 0.72, -r * 0.35);
        ctx.lineTo(-r * 0.85, -r * 1.12);
        ctx.lineTo(-r * 0.18, -r * 0.78);
        ctx.closePath();
        ctx.fill();
        // Right ear
        ctx.beginPath();
        ctx.moveTo(r * 0.72, -r * 0.35);
        ctx.lineTo(r * 0.85, -r * 1.12);
        ctx.lineTo(r * 0.18, -r * 0.78);
        ctx.closePath();
        ctx.fill();

        // Inner pink ears
        ctx.shadowBlur = 0;
        ctx.fillStyle = earInner;
        ctx.beginPath();
        ctx.moveTo(-r * 0.64, -r * 0.48);
        ctx.lineTo(-r * 0.74, -r * 0.96);
        ctx.lineTo(-r * 0.32, -r * 0.74);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(r * 0.64, -r * 0.48);
        ctx.lineTo(r * 0.74, -r * 0.96);
        ctx.lineTo(r * 0.32, -r * 0.74);
        ctx.closePath();
        ctx.fill();

        // Extra chonky round body (wider than tall!)
        ctx.fillStyle = coat;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.05, r * 1.16, r * 0.95, 0, 0, Math.PI * 2);
        ctx.fill();

        // Chubby cream belly patch
        ctx.fillStyle = belly;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.38, r * 0.64, r * 0.46, 0, 0, Math.PI * 2);
        ctx.fill();

        // Forehead tabby stripes
        if (!isHit) {
          ctx.strokeStyle = stripe;
          ctx.lineWidth = Math.max(1.5, r * 0.1);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, -r * 0.82);
          ctx.lineTo(0, -r * 0.5);
          ctx.moveTo(-r * 0.24, -r * 0.76);
          ctx.lineTo(-r * 0.18, -r * 0.52);
          ctx.moveTo(r * 0.24, -r * 0.76);
          ctx.lineTo(r * 0.18, -r * 0.52);
          ctx.stroke();
        }

        // Tiny chubby paws
        ctx.fillStyle = belly;
        ctx.beginPath();
        ctx.arc(-r * 0.48, r * 0.84, r * 0.2, 0, Math.PI * 2);
        ctx.arc(r * 0.48, r * 0.84, r * 0.2, 0, Math.PI * 2);
        ctx.fill();

        // Face (Eyes, grumpy brows for elite/boss, pink nose, ω mouth, whiskers)
        if (!isHit) {
          const eyeY = -r * 0.12;
          const eyeX = r * 0.36;
          const eyeR = Math.max(2, r * 0.15);

          ctx.fillStyle = eyeColor;
          ctx.beginPath();
          ctx.arc(-eyeX, eyeY, eyeR, 0, Math.PI * 2);
          ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2);
          ctx.fill();

          // Cute eye sparkle
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-eyeX - eyeR * 0.3, eyeY - eyeR * 0.3, eyeR * 0.35, 0, Math.PI * 2);
          ctx.arc(eyeX - eyeR * 0.3, eyeY - eyeR * 0.3, eyeR * 0.35, 0, Math.PI * 2);
          ctx.fill();

          // Grumpy eyebrows on tank / elite / boss
          if (e.type === 'tank' || e.type === 'elite' || e.type === 'boss') {
            ctx.strokeStyle = stripe;
            ctx.lineWidth = Math.max(1.8, r * 0.1);
            ctx.beginPath();
            ctx.moveTo(-eyeX - eyeR, eyeY - eyeR * 1.4);
            ctx.lineTo(-eyeX + eyeR, eyeY - eyeR * 0.8);
            ctx.moveTo(eyeX + eyeR, eyeY - eyeR * 1.4);
            ctx.lineTo(eyeX - eyeR, eyeY - eyeR * 0.8);
            ctx.stroke();
          }

          // Pink triangle nose
          ctx.fillStyle = '#fb7185';
          ctx.beginPath();
          ctx.moveTo(-r * 0.1, r * 0.03);
          ctx.lineTo(r * 0.1, r * 0.03);
          ctx.lineTo(0, r * 0.14);
          ctx.closePath();
          ctx.fill();

          // Cute ω cat mouth
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = Math.max(1.2, r * 0.07);
          ctx.beginPath();
          ctx.arc(-r * 0.11, r * 0.17, r * 0.11, 0, Math.PI, false);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(r * 0.11, r * 0.17, r * 0.11, 0, Math.PI, false);
          ctx.stroke();

          // Whiskers
          ctx.strokeStyle = 'rgba(248, 250, 252, 0.72)';
          ctx.lineWidth = Math.max(1, r * 0.055);
          ctx.beginPath();
          ctx.moveTo(-r * 0.62, r * 0.04);
          ctx.lineTo(-r * 1.18, -r * 0.04);
          ctx.moveTo(-r * 0.62, r * 0.16);
          ctx.lineTo(-r * 1.16, r * 0.24);
          ctx.moveTo(r * 0.62, r * 0.04);
          ctx.lineTo(r * 1.18, -r * 0.04);
          ctx.moveTo(r * 0.62, r * 0.16);
          ctx.lineTo(r * 1.16, r * 0.24);
          ctx.stroke();
        }

        // Golden Crown for Final Boss & small collar bell for Elite
        if (e.type === 'boss') {
          ctx.fillStyle = '#fbbf24';
          ctx.strokeStyle = '#92400e';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-r * 0.45, -r * 0.85);
          ctx.lineTo(-r * 0.55, -r * 1.38);
          ctx.lineTo(-r * 0.18, -r * 1.1);
          ctx.lineTo(0, -r * 1.48);
          ctx.lineTo(r * 0.18, -r * 1.1);
          ctx.lineTo(r * 0.55, -r * 1.38);
          ctx.lineTo(r * 0.45, -r * 0.85);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        } else if (e.type === 'elite') {
          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.arc(0, r * 0.52, r * 0.18, 0, Math.PI * 2);
          ctx.fill();
        }

        // Elite / Tank mini HP bar
        if ((e.type === 'elite' || e.type === 'tank') && e.hp < e.maxHp) {
          ctx.rotate(-w * 0.08);
          const bw = r * 2.1;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
          ctx.fillRect(-bw / 2, -r * 1.32, bw, 4);
          ctx.fillStyle = e.type === 'elite' ? '#fbbf24' : '#cbd5e1';
          ctx.fillRect(-bw / 2, -r * 1.32, bw * Math.max(0, e.hp / e.maxHp), 4);
        }

        ctx.restore();
      }

      function drawIdleBackground() {
        const gridSize = 64;
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.06)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x < width; x += gridSize) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
        }
        for (let y = 0; y < height; y += gridSize) {
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
        }
        ctx.stroke();
      }

      // --- Main Loop ---
      function loop(timestamp) {
        if (!lastFrameTime) lastFrameTime = timestamp;
        const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000);
        lastFrameTime = timestamp;

        update(dt);
        draw();

        animFrameId = requestAnimationFrame(loop);
      }

      function resizeCanvas() {
        const rect = container.getBoundingClientRect();
        width = Math.max(320, rect.width);
        height = Math.max(240, rect.height);
        const minDim = Math.min(width, height);
        worldScale = minDim < 520 ? Math.max(0.72, minDim / 520) : 1;
        isLowPowerMobile = isTouchDevice && minDim < 640;
        dpr = Math.min(window.devicePixelRatio || 1, isLowPowerMobile ? 1.5 : 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        controlHint.textContent = isTouchDevice ? tr().hintTouch : tr().hintDesktop;
        draw();
      }

      // --- Input Handlers ---
      window.addEventListener('keydown', function (e) {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
          e.preventDefault();
        }
        keys[e.code] = true;

        if (gameState === 'levelup') {
          if (e.key === '1') selectUpgrade(0);
          else if (e.key === '2') selectUpgrade(1);
          else if (e.key === '3') selectUpgrade(2);
          return;
        }

        if (e.code === 'KeyP' || e.code === 'Escape') {
          if (gameState === 'playing') {
            gameState = 'paused';
            pauseOverlay.classList.remove('hidden');
          } else if (gameState === 'paused') {
            gameState = 'playing';
            pauseOverlay.classList.add('hidden');
          }
        } else if ((e.code === 'KeyR' || e.code === 'Enter') && (gameState === 'gameover' || gameState === 'victory')) {
          ensureAudio();
          resetGame();
        }
      });

      window.addEventListener('keyup', function (e) {
        keys[e.code] = false;
      });

      window.addEventListener('blur', function () {
        for (const k in keys) keys[k] = false;
        joystick.active = false;
        joystick.dx = 0;
        joystick.dy = 0;
      });

      // Pointer / Touch Virtual Joystick on Canvas
      canvas.addEventListener('pointerdown', function (e) {
        if (gameState !== 'playing') return;
        ensureAudio();
        const rect = canvas.getBoundingClientRect();
        joystick.active = true;
        joystick.pointerId = e.pointerId;
        joystick.originX = e.clientX - rect.left;
        joystick.originY = e.clientY - rect.top;
        joystick.currX = joystick.originX;
        joystick.currY = joystick.originY;
        joystick.dx = 0;
        joystick.dy = 0;
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      });

      canvas.addEventListener('pointermove', function (e) {
        if (!joystick.active || e.pointerId !== joystick.pointerId) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const dx = x - joystick.originX;
        const dy = y - joystick.originY;
        const dist = Math.hypot(dx, dy);
        const clamped = Math.min(dist, joystick.maxRadius);
        const angle = Math.atan2(dy, dx);
        joystick.currX = joystick.originX + Math.cos(angle) * clamped;
        joystick.currY = joystick.originY + Math.sin(angle) * clamped;
        joystick.dx = dist > 4 ? (Math.cos(angle) * clamped) / joystick.maxRadius : 0;
        joystick.dy = dist > 4 ? (Math.sin(angle) * clamped) / joystick.maxRadius : 0;
      });

      function releaseJoystick(e) {
        if (joystick.active && e.pointerId === joystick.pointerId) {
          joystick.active = false;
          joystick.pointerId = null;
          joystick.dx = 0;
          joystick.dy = 0;
        }
      }

      canvas.addEventListener('pointerup', releaseJoystick);
      canvas.addEventListener('pointercancel', releaseJoystick);

      // UI Button Listeners
      startBtn.addEventListener('click', function () {
        ensureAudio();
        resetGame();
      });

      restartBtn.addEventListener('click', function () {
        ensureAudio();
        resetGame();
      });

      pauseRestartBtn.addEventListener('click', function () {
        ensureAudio();
        resetGame();
      });

      resumeBtn.addEventListener('click', function () {
        if (gameState === 'paused') {
          gameState = 'playing';
          pauseOverlay.classList.add('hidden');
        }
      });

      continueEndlessBtn.addEventListener('click', function () {
        endlessMode = true;
        gameoverOverlay.classList.add('hidden');
        showWaveBanner(tr().endlessStart);
        updateHUD();
        gameState = 'playing';
      });

      pauseBtn.addEventListener('click', function () {
        if (gameState === 'playing') {
          gameState = 'paused';
          pauseOverlay.classList.remove('hidden');
        } else if (gameState === 'paused') {
          gameState = 'playing';
          pauseOverlay.classList.add('hidden');
        }
      });

      function applyLanguage(lang) {
        currentLang = lang === 'ja' ? 'ja' : 'ko';
        try { localStorage.setItem(LANG_KEY, currentLang); } catch (e) {}
        const t = tr();

        document.documentElement.lang = currentLang;
        document.title = t.pageTitle;
        langBtn.textContent = currentLang === 'ko' ? 'JP' : 'KR';
        startLangBtn.textContent = currentLang === 'ko' ? '🌐 日本語로 전환' : '🌐 한국어に切替';

        killLabel.textContent = t.killLabel;
        bossNameEl.textContent = t.bossName;
        muteBtn.title = t.muteTitle;
        muteBtn.setAttribute('aria-label', t.muteTitle);
        pauseBtn.title = t.pauseTitleAttr;
        pauseBtn.setAttribute('aria-label', t.pauseTitleAttr);

        startTitleEl.textContent = t.startTitle;
        startSubtitleEl.innerHTML = t.startSubtitle;
        infoVal1.innerHTML = t.info1Val;
        infoLbl1.textContent = t.info1Lbl;
        infoVal2.innerHTML = t.info2Val;
        infoLbl2.textContent = t.info2Lbl;
        infoIcon3.innerHTML = FISHBONE_SVG_MD;
        infoVal3.innerHTML = t.info3Val;
        infoLbl3.textContent = t.info3Lbl;
        startBtn.textContent = t.startBtn;

        pauseTitleEl.textContent = t.pauseHeading;
        pauseSubtitleEl.textContent = t.pauseSub;
        resumeBtn.textContent = t.resumeBtn;
        pauseRestartBtn.textContent = t.pauseRestartBtn;

        lblResultTime.textContent = t.resTime;
        lblResultKills.textContent = t.resKills;
        lblResultLevel.textContent = t.resLevel;
        continueEndlessBtn.textContent = t.endlessBtn;
        restartBtn.textContent = t.restartBtn;

        controlHint.textContent = isTouchDevice ? t.hintTouch : t.hintDesktop;
        updateStartRecordText();
        if (player) updateBuildStrip();
        if (gameState === 'levelup') renderUpgradeCards();
        if (gameState === 'victory') {
          gameoverTitle.textContent = t.victoryTitle;
          gameoverSubtitle.textContent = t.victorySub;
          const rec = loadRecord();
          gameoverRecord.innerHTML = t.recordFmt(formatTime(rec.bestTime), rec.bestKills);
        } else if (gameState === 'gameover') {
          gameoverTitle.textContent = t.gameoverTitle;
          gameoverSubtitle.textContent = t.gameoverSub;
          const rec = loadRecord();
          gameoverRecord.innerHTML = t.recordFmt(formatTime(rec.bestTime), rec.bestKills);
        }
      }

      function toggleLanguage() {
        applyLanguage(currentLang === 'ko' ? 'ja' : 'ko');
      }

      langBtn.addEventListener('click', toggleLanguage);
      startLangBtn.addEventListener('click', toggleLanguage);

      muteBtn.addEventListener('click', function () {
        muted = !muted;
        muteBtn.textContent = muted ? '🔇' : '🔊';
        if (!muted) ensureAudio();
      });

      window.addEventListener('resize', resizeCanvas);
      window.addEventListener('orientationchange', function () {
        setTimeout(resizeCanvas, 120);
      });

      window.onload = function () {
        applyLanguage(currentLang);
        resizeCanvas();
        if (animFrameId) cancelAnimationFrame(animFrameId);
        lastFrameTime = 0;
        animFrameId = requestAnimationFrame(loop);
      };
    })();
  </script>
</body>
</html>
